server:
  servlet:
    context-path: /maoyan
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/maoyan
    username: root
    password: root
    type: com.alibaba.druid.pool.DruidDataSource
  mvc:
    format:
      date-time: yyyy-MM-dd HH:mm:ss
      date: yyyy-MM-dd
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: com/cyz/maoyan/mapper/*.xml

pagehelper:
  helper-dialect: mysql
  support-methods-arguments: true

alipay:
  easy:
    protocol: https
    gatewayHost: openapi-sandbox.dl.alipaydev.com
    signType: RSA2
    appId: 9021000151606875
    merchantPrivateKey: 
    alipayPublicKey: 
    notifyUrl: https://2affa8a9.r24.cpolar.top/maoyan/alipay/notify
